name: explorer-lint-tmp
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: |
          rustc --version; echo "::warning::$(rustc --version) / $(cargo clippy --version)"
          for t in "" "--target wasm32-unknown-unknown"; do
            cargo clippy -p rbx_explorer --all-targets $t --message-format=short -- -D warnings 2>&1 | tee -a out.txt || true
          done
          grep -E "^(crates|error|warning)" out.txt | grep -v "^warning: build failed" | head -40 | while read -r l; do echo "::error::$l"; done
