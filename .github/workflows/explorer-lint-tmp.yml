name: explorer-lint-tmp
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: |
          rustc --version; echo "::warning::$(rustc --version) / $(cargo clippy --version)"
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee -a out.txt || true
          grep -E "^(crates|error|warning)" out.txt | grep -v "^warning: build failed" | sort -u | head -45 | while read -r l; do echo "::error::$l"; done
