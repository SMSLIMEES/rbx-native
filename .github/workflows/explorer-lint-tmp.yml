name: explorer-lint-tmp
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo clippy --workspace --all-targets --keep-going --message-format=short 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee out.txt || true
          n=$(grep -cE "^crates/.*(warning|error)" out.txt || true)
          echo "::warning::total $n"
          grep -E "^crates/.*(warning|error)|^error" out.txt | sort -u | head -48 | while read -r l; do echo "::error::$l"; done
